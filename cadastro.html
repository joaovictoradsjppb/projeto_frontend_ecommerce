<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastre-se | Cozinha Moderna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <div>
        <h1>Cozinha Moderna</h1>
        <p class="slogan">Sua cozinha organizada e eficaz.</p>
      </div>
      <a href="index.html" class="carrinho" aria-label="Ir para o carrinho">🛒 <span id="contador">0</span></a>
    </div>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="index.html#produtos">Produtos</a>
      <a href="cadastro.html" class="ativo">Cadastre-se</a>
    </nav>
  </header>

  <section class="banner banner-cadastro">
    <h2>Crie sua conta</h2>
    <p>Cadastre-se para comprar mais rápido e receber ofertas.</p>
  </section>

  <main class="cadastro">

    <form id="formCadastro" novalidate>
      <div class="sucesso" id="sucesso">Cadastro realizado com sucesso! Redirecionando...</div>

      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" autocomplete="name">
        <p class="msg-erro"></p>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email">
        <p class="msg-erro"></p>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
          <p class="msg-erro"></p>
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" placeholder="(83) 90000-0000" maxlength="15" inputmode="numeric">
          <p class="msg-erro"></p>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="new-password">
          <p class="msg-erro"></p>
        </div>
        <div class="campo">
          <label for="senha2">Confirmar senha</label>
          <input type="password" id="senha2" autocomplete="new-password">
          <p class="msg-erro"></p>
        </div>
      </div>

      <label class="termos"><input type="checkbox" id="termos"> Aceito os termos de uso</label>
      <p class="msg-erro" id="erroTermos"></p>

      <button type="submit" class="btn btn-full">Cadastrar</button>
    </form>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Cozinha Moderna. Todos os direitos reservados.</p>
  </footer>

  <script src="cadastro.js"></script>
</body>
</html>
