<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozinha Moderna</title>
  <link rel="stylesheet" href="style.css">
 
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <div>
        <h1>Cozinha Moderna</h1>
        <p class="slogan">Sua cozinha organizada e eficaz.</p>
      </div>
      <button class="carrinho" id="btnCarrinho" aria-label="Abrir carrinho">
        🛒 <span id="contador">0</span>
      </button>
    </div>
    <nav class="menu">
      <a href="#inicio" class="ativo">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="cadastro.html">Cadastre-se</a>
    </nav>
  </header>

  <main>
    <section id="inicio" class="banner">
      <h2>Tudo para uma cozinha prática</h2>
      <p>Escolha seus eletros favoritos e finalize em poucos cliques.</p>
      <a href="#produtos" class="btn">Ver produtos</a>
    </section>

    <section id="produtos">
      <h2 class="titulo-secao">Nossos produtos</h2>
      <div class="grade" id="grade"></div>
    </section>
  </main>

  <!-- Detalhe do produto (tela cheia) -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-conteudo">
      <button class="fechar" id="fecharModal" aria-label="Fechar">✕</button>
      <div class="galeria">
        <div class="imagem-grande" id="imgGrande"></div>
        <div class="miniaturas" id="miniaturas"></div>
      </div>
      <div class="info">
        <h2 id="mNome"></h2>
        <p class="preco-grande" id="mPreco"></p>
        <p id="mDesc"></p>
        <ul id="mSpecs"></ul>
        <button class="btn" id="mAdd">Adicionar ao carrinho</button>
      </div>
    </div>
  </div>

  <!-- Carrinho lateral -->
  <aside class="carrinho-painel" id="painel">
    <div class="painel-topo">
      <h3>Seu carrinho</h3>
      <button class="fechar" id="fecharPainel" aria-label="Fechar carrinho">✕</button>
    </div>
    <ul id="itens"></ul>
    <p class="total">Total: <strong id="total">R$ 0,00</strong></p>
    <a href="pagamento.html" class="btn btn-full" id="finalizar">Finalizar compra</a>
  </aside>
  <div class="fundo" id="fundo"></div>

  <script src="script.js"></script>
</body>
</html>
