<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozinha Moderna</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container1">
            <div>
                <h1 class="titulo">Cozinha Moderna</h1>
            </div>
            <nav class="container2">
                <div>
                    <a href="index.html">INICIO</a>
                </div>
                <div class="menu-suspenso">
                    <a href="#PRODUTO">PRODUTOS</a>
                    <ul class="lista-links">
                        <li><a href="#Geladeira">Geladeira</a></li>
                        <li><a href="#Fogão">Fogão</a></li>
                        <li><a href="#Panela">Panela</a></li>
                    </ul>
                </div>
                <div>
                    <a href="formulario.html">CADASTRA-SE</a>

                </div>
                <div>
                    <img src="https://cdn-icons-png.flaticon.com/128/3737/3737173.png" id="carrinho">
                </div>
            </nav>
        </div>
        <input type="text" id="nome" name="nome" placeholder="Pesquisar" />

    </header>
    

    <section id="form">
        <div>
        <form>
                <label>E-mail</label><br>
                <input type="email" name="email" placeholder="Digite seu Email" class="formulario" required><br>
                <label>Senha</label><br>
                <input type="password" name="senha" placeholder="Digite sua senha" class="formulario" required><br>
        </form>
        </div>
        <div>
            <form action="obrigado.html" method="get">
                <legend>
                    <h3>Cadastre-se</h3>
                </legend>
                <label>Nome</label><br>
                <input type="text" placeholder="Nome" name="nome" class="formulario" required><br>
                <label>E-mail</label><br>
                <input type="email" name="email" placeholder="Digite seu Email" class="formulario" required><br>
                <label>Telefone</label><br>
                <input type="number" max="99999999999" placeholder="Telefone" name="telefone" class="formulario"
                    required><br>
                <label>Idade</label><br>
                <input type="number" placeholder="Idade" name="idade" class="formulario" required>
                <br>
                <label>Selecione seu curso</label>
                <br>
                <select name="curso" class="formulario">
                    <option disabled selected>Selecione na Lista</option>
                    <option value="ADS">ADS</option>
                    <option value="computação">Computação</option>
                    <option value="medicina">Medicina</option>
                    <option value="administração">Administração</option>
                    <option value="nada">Ainda não decidi</option>
                </select>
                <br>
            </form>
        </div>
    </section>

</body>

</html>
